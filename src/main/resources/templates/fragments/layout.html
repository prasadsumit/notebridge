<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Turn your notes into explainable practice tests.">
    <title th:replace="${title}">Notebridge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" id="app-sidebar" aria-label="Primary navigation">
        <a class="brand" th:href="@{/}" aria-label="Notebridge home">
            <span class="brand-mark" aria-hidden="true">N</span><span>Notebridge</span>
        </a>
        <p class="workspace-label">Study workspace</p>
        <nav class="site-nav">
            <a th:href="@{/}" data-route="/">Overview</a>
            <a th:href="@{/sources}" data-route="/sources">Sources</a>
            <a th:href="@{/reviews}" data-route="/reviews">Review queue</a>
            <a th:href="@{/quizzes/new}" data-route="/quizzes">New quiz</a>
            <a th:href="@{/history}" data-route="/history">History</a>
        </nav>
        <div class="sidebar-footer"><span class="status-dot"></span><span>Local-first workspace</span><small>Your notes stay read-only.</small></div>
    </aside>
    <div class="app-workspace">
        <header class="topbar">
            <button class="menu-button" type="button" aria-controls="app-sidebar" aria-expanded="false">Menu</button>
            <p class="breadcrumb">Notebridge <span aria-hidden="true">/</span> <span data-page-name>Overview</span></p>
        </header>
        <main><div th:replace="${content}"></div></main>
        <footer>Notebridge runs on your computer. Your notes folder is always read-only.</footer>
    </div>
</div>
<div class="loading-overlay" id="loading-overlay" hidden role="status" aria-live="assertive" aria-atomic="true">
    <div class="loading-panel"><span class="loading-spinner" aria-hidden="true"></span><strong id="loading-overlay-title">Working…</strong><span id="loading-overlay-detail">Please keep this page open.</span></div>
</div>
<script th:src="@{/js/app.js}" defer></script>
</body>
</html>
