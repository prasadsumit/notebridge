<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::div.page-content})}">
<head><title>New quiz · Notebridge</title></head>
<body>
<div class="page-content">
<section class="page-header"><p class="eyebrow"></p>
    <h1>Create a quiz</h1>
    <p class="lede">Every correct answer is grounded in eligible note excerpts. Broader retrieval is used for harder
        quizzes.</p>
    <p class="flash error" th:if="${error}" th:text="${error}"></p></section>
<form th:action="@{/quizzes}" th:object="${request}" method="post" class="setup-form api-form" data-loading-overlay="Generating your quiz" data-loading-detail="This can take a moment while we ground questions in your sources."><label>Topic <input
        th:field="*{topic}" placeholder="Optional, for example: Java collections"></label><label>Difficulty <select
        th:field="*{difficulty}">
    <option th:each="difficulty : ${difficulties}" th:value="${difficulty}" th:text="${difficulty}"></option>
</select></label><label>Question type <select th:field="*{questionType}">
    <option th:each="type : ${types}" th:value="${type}" th:text="${type}"></option>
</select></label><label>Questions <input th:field="*{questionCount}" type="number" min="1" max="50"></label>
    <button class="button button-primary" type="submit" data-loading-label="Generating quiz…">Generate quiz <span>→</span></button>
</form>
</div>
</body>
</html>
