services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-notebridge}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-notebridge}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-notebridge}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-notebridge}
      POSTGRES_USER: ${POSTGRES_USER:-notebridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notebridge}
    ports:
      - "5432:5432"
    volumes:
      - notebridge-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  notebridge-data:
